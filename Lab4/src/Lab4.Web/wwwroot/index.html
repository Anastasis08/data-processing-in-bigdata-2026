<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Схвалення кредиту</title>
  <style>
    :root {
      --bg: #e9e4f5; --card: #f6f2fc; --field: #ffffffb3; --text: #221a35; --muted: #6e6488;
      --border: #d6cdea; --accent: #4c1d95; --accent-2: #6d28d9;
      --ok: #16a34a; --bad: #dc2626; --warn: #d97706;
      color-scheme: light; font-family: "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #120b20; --card: #1c1430; --field: #251b3d; --text: #ece6f8; --muted: #a79bc4; --border: #33284f; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
    header {
      padding: 2.5rem 1rem 5rem; text-align: center; color: #fff;
      background: linear-gradient(135deg, #2e1065, var(--accent) 55%, var(--accent-2));
    }
    header h1 { margin: 0; font-size: 2rem; letter-spacing: -.02em; }
    header p { margin: .5rem 0 0; opacity: .85; }
    main { max-width: 760px; margin: -3.5rem auto 2rem; padding: 0 1rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1.75rem; box-shadow: 0 16px 40px rgb(46 16 101 / .18);
    }
    fieldset { border: 0; margin: 0 0 1.5rem; padding: 0; }
    legend { font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: .75rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: .9rem 1rem; }
    label { display: grid; gap: .35rem; font-size: .9rem; font-weight: 500; }
    input, select {
      font: inherit; padding: .6rem .75rem; border-radius: 10px; border: 1px solid var(--border);
      background: var(--field); color: var(--text); transition: border-color .15s, box-shadow .15s;
    }
    .hint { font-size: .75rem; font-weight: 400; color: var(--muted); }
    input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgb(109 40 217 / .25); }
    button {
      width: 100%; font: inherit; font-weight: 600; padding: .85rem; border: 0; border-radius: 12px; cursor: pointer;
      color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); transition: transform .1s, opacity .15s;
    }
    button:hover { opacity: .92; }
    button:active { transform: scale(.99); }
    button:disabled { opacity: .6; cursor: wait; }
    #result { display: none; margin-top: 1.25rem; padding: 1.25rem; border-radius: 14px; border: 1px solid var(--border); }
    #result.show { display: block; animation: fade .25s ease-out; }
    #result .head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
    #result .decision { font-size: 1.4rem; font-weight: 700; }
    #result .percent { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    #result .caption { color: var(--muted); font-size: .85rem; margin-top: .25rem; }
    .bar { height: 10px; border-radius: 99px; background: var(--border); overflow: hidden; margin-top: .9rem; }
    .bar span { display: block; height: 100%; width: 0; border-radius: inherit; transition: width .5s ease-out; }
    #result.approve { background: rgb(22 163 74 / .08); border-color: rgb(22 163 74 / .35); }
    #result.approve .decision, #result.approve .percent { color: var(--ok); }
    #result.approve .bar span { background: var(--ok); }
    #result.reject { background: rgb(220 38 38 / .08); border-color: rgb(220 38 38 / .35); }
    #result.reject .decision, #result.reject .percent { color: var(--bad); }
    #result.reject .bar span { background: var(--bad); }
    #result.error { background: rgb(217 119 6 / .1); border-color: rgb(217 119 6 / .4); color: var(--warn); }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <header>
    <h1>Схвалення кредиту</h1>
    <p>Заповніть дані заявника, щоб отримати прогноз</p>
  </header>

  <main>
    <form id="loan-form" class="card">
      <fieldset>
        <legend>Заявник</legend>
        <div class="grid">
          <label>Стать
            <select name="gender"><option value="Male">Чоловіча</option><option value="Female">Жіноча</option><option value="">Невідомо</option></select>
          </label>
          <label>У шлюбі
            <select name="married"><option value="Yes">Так</option><option value="No">Ні</option><option value="">Невідомо</option></select>
          </label>
          <label>Утриманці
            <select name="dependents"><option>0</option><option>1</option><option>2</option><option>3+</option><option value="">Невідомо</option></select>
          </label>
          <label>Освіта
            <select name="education"><option value="Graduate">Вища</option><option value="Not Graduate">Без вищої</option><option value="">Невідомо</option></select>
          </label>
          <label>Самозайнятий
            <select name="selfEmployed"><option value="No">Ні</option><option value="Yes">Так</option><option value="">Невідомо</option></select>
          </label>
          <label>Місцевість
            <select name="propertyArea"><option value="Semiurban">Передмістя</option><option value="Urban">Місто</option><option value="Rural">Село</option><option value="">Невідомо</option></select>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Фінанси та кредит</legend>
        <div class="grid">
          <label>Дохід заявника
            <input name="applicantIncome" type="number" min="0" value="5000" required>
          </label>
          <label>Дохід співзаявника
            <input name="coapplicantIncome" type="number" min="0" value="1500" required>
          </label>
          <label>Кредитна історія
            <select name="creditHistory"><option value="1">Є</option><option value="0">Немає</option><option value="">Невідомо</option></select>
          </label>
          <label>Сума кредиту, тис.
            <input name="loanAmount" type="number" min="1" max="10000" value="130" placeholder="невідомо">
            <small class="hint">У даних 9–700 тис., типово 100–160. Порожньо = невідомо</small>
          </label>
          <label>Строк кредиту
            <select name="loanAmountTerm">
              <option value="12">12 міс. (1 рік)</option>
              <option value="36">36 міс. (3 роки)</option>
              <option value="60">60 міс. (5 років)</option>
              <option value="84">84 міс. (7 років)</option>
              <option value="120">120 міс. (10 років)</option>
              <option value="180">180 міс. (15 років)</option>
              <option value="240">240 міс. (20 років)</option>
              <option value="300">300 міс. (25 років)</option>
              <option value="360" selected>360 міс. (30 років)</option>
              <option value="480">480 міс. (40 років)</option>
              <option value="">Невідомо</option>
            </select>
            <small class="hint">360 міс. мають ~85 % заявок у даних</small>
          </label>
        </div>
      </fieldset>

      <button type="submit">Оцінити заявку</button>

      <div id="result" role="status" aria-live="polite">
        <div class="head"><span class="decision"></span><span class="percent"></span></div>
        <div class="caption"></div>
        <div class="bar"><span></span></div>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById("loan-form");
    const button = form.querySelector("button");
    const result = document.getElementById("result");
    const decision = result.querySelector(".decision");
    const percent = result.querySelector(".percent");
    const caption = result.querySelector(".caption");
    const bar = result.querySelector(".bar span");
    const numberFields = new Set(["applicantIncome", "coapplicantIncome", "loanAmount", "loanAmountTerm"]);

    function show(state, title, value, text) {
      result.className = `show ${state}`;
      decision.textContent = title;
      percent.textContent = value;
      caption.textContent = text;
      bar.style.width = "0";
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const body = {};
      for (const [name, value] of new FormData(form)) {
        body[name] = value === "" ? null : numberFields.has(name) ? Number(value) : value;
      }

      button.disabled = true;
      try {
        const response = await fetch("/api/loans/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await response.json();

        if (!response.ok) {
          const errors = data.errors ? Object.values(data.errors).flat().join(" ") : data.title;
          show("error", "Помилка", response.status, errors);
          return;
        }

        const probability = data.approvalProbability * 100;
        show(
          data.isApproved ? "approve" : "reject",
          data.isApproved ? "Кредит схвалено" : "У кредиті відмовлено",
          `${probability.toFixed(1)} %`,
          "Ймовірність схвалення");
        requestAnimationFrame(() => bar.style.width = `${probability}%`);
      } catch {
        show("error", "Сервер недоступний", "", "Перевірте, що застосунок запущено.");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
